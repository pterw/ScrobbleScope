# DOC012 has been enforced since 2026-08-26, but the range that documents the docsync
# codes drifted twice -- DOC001-DOC006, then DOC001-DOC011 -- and nothing checked it,
# because no declaration and no test compared the stated range with the codes raised.
# The drift survived in AGENTS.md until 2026-09-11 and had already been copied into a
# rebuilt architecture document.
#
# The pattern matches the PRESCRIPTIVE phrasing, not the bare code, and takes the
# range in either spelling it has shipped in -- contiguous `DOC001-DOC011` and
# backtick-split `DOC001`-`DOC011` -- so AGENTS.md's own true sentence about the
# declared DOC009 to DOC011 kinds stays out. The backticks are optional so both
# spellings match: this declaration was written for a backtick-split instance,
# and a pattern carrying the contiguous literal alone could not match it.
# A pattern matches text shape, and cannot tell "states the range as X" from
# "records that it was formerly X"; a record leaves itself out by using the past
# tense. The 40-character gap, and a verb list without `typed`, are what catch a
# stale range stated as a plain present-tense fact -- a second live phrasing,
# found in that same plan on 2026-09-11. A still broader form was measured and
# rejected for flagging true sentences instead.
[[retired]]
name = "the docsync integrity range ends at DOC011"
reason = "DOC012 has been enforced since 2026-08-26; the range is DOC001-DOC012."
pattern = '(?:reports|returns|states).{0,40}DOC001`?-`?DOC011'
scan = ["*.md", "docs/**/*.md", ".claude/SESSION_CONTEXT.md"]
allow_files = ["docs/history/*", "docs/logarchive/*", "CLAUDE.md"]

[retired.allow_after]
"docs/agents/PLAYBOOK.md" = "## 4. Execution log (for agent handoff)"

# Task 5 (2026-09-24) retired the range itself, not just its upper bound: the
# catalogue's explicit list -- "DOC001-DOC020, DOC023 and DOC024" -- has a gap
# (DOC021 and DOC022 are reserved by docs/superpowers/plans/
# 2026-09-12-repository-agnostic-plan-spec-guards.md but not yet raised), so a
# contiguous "DOC001-DOC023" or "DOC001-DOC024" is false on arrival, the same
# way the old DOC001-DOC0NN range went stale, and no later renumbering can
# make either true again. The explicit list never contains either substring
# (it names "DOC001-DOC020" as its own span, separately from "DOC023" and
# "DOC024"), so this declaration needs no verb-prefix guard like its DOC011
# sibling above: the pattern matches the bare literal in either spelling that
# has shipped -- contiguous `DOC001-DOC023` and backtick-split
# `DOC001`-`DOC024` -- while leaving the valid `DOC001-DOC020` span alone.
# docs/superpowers/plans/ is allowed because that plan cites DOC001-DOC022 as
# a future target for its own Tasks 5-6, not a claim about what the package
# raises today.
[[retired]]
name = "the docsync range is DOC001-DOC023 or DOC001-DOC024"
reason = "The catalogue states no contiguous range; DOC021/DOC022 are reserved, not raised."
pattern = '`?DOC001`?-`?DOC02[34]`?'
scan = ["*.md", "docs/**/*.md", ".claude/SESSION_CONTEXT.md"]
allow_files = ["docs/history/*", "docs/logarchive/*", "docs/superpowers/*", "CLAUDE.md"]

# The exemption compares the raw line verbatim (declarations.py
# check_retired), so it needs docs/agents/PLAYBOOK.md's real heading text. F-DOCSYNC-16
# records that an unmatched allow_after marker is silently ignored rather
# than erroring.
[retired.allow_after]
"docs/agents/PLAYBOOK.md" = "## 4. Execution log (for agent handoff)"

# ----------------------------------------------------------------------
# Findings
# ----------------------------------------------------------------------

# Findings that read as finished but predate the lifecycle record, listed
# so DOC023 can report them as a counted warning instead of blocking on
# history nobody can retroactively assert. An id absent from this list is
# admitted, which is why the list is ids and not a batch boundary: a
# source tag like F-DOCSYNC-9 carries no batch number, so a boundary
# would grandfather every tagged finding by accident and let a new one
# escape by choosing a tag.
#
# This list only shrinks. Give a finding its `- [x] **Status:**` record,
# then delete its id here. Adding an id is a reviewable diff, on purpose.
[findings]
# Emptied 2026-09-20: all 23 were given their records and the 16 their
# authors called finished have rotated to the archive. The list is meant to
# empty, and it has. It stays declared so the next repository to adopt this
# gate starts strict, with somewhere to put its own history.
grandfathered = []

[test_count]
pinned = 1897
