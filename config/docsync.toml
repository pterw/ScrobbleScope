# Facts this repository writes down more than once.
#
# `scripts/docsync/declarations.py` is the mechanism and carries to any
# repository unchanged. This file is the local half: what is duplicated here,
# and where. Every entry below was added because the copies really did drift
# and a reviewer caught it, not because the drift was imagined. F-B21-17.
#
# Three kinds:
#   [[value]]    one value, several places, they must agree
#   [[anchor]]   a cross-reference must resolve to something that exists
#   [[retired]]  a claim that is no longer true must not still prescribe

# ----------------------------------------------------------------------
# Options
# ----------------------------------------------------------------------

# Is ~~struck-through text~~ already saying "not current"?
#
# True here, because this repository only ever strikes text through to keep a
# superseded step visible beside its reversal. It is a convention, not a rule
# of Markdown: a repository that strikes text through rhetorically -- "~~bugs~~
# features" -- should set this false, or the checker hands a retired claim an
# invisibility cloak. Any [[retired]] entry can override it.
[options]
strikethrough_exempt = true

# ----------------------------------------------------------------------
# Document locations
# ----------------------------------------------------------------------

# These four documents moved from the repository root to docs/agents/ (root cleanup,
# 2026-09-24). AGENTS.md itself is not declared here: it never moves.
[documents]
playbook = "docs/agents/PLAYBOOK.md"
findings = "docs/agents/FINDINGS.md"
agent_notes = "docs/agents/AGENT_NOTES.md"
handoff_prompt = "docs/agents/HANDOFF_PROMPT.md"

# ----------------------------------------------------------------------
# Archive thresholds
# ----------------------------------------------------------------------

# Neither key is a declaration: these are the sizes a maintenance run uses, not
# facts a check verifies. Both are required once the table is present, so a
# half-written table cannot paginate at a size nobody chose; remove the table
# entirely to take the documented defaults (500 / 365).
[archives]
max_lines = 500
cold_days = 365

# ----------------------------------------------------------------------
# Close-out admission
# ----------------------------------------------------------------------

# The lowest batch whose closure the six close-out signals are evaluated
# against. Everything at or above it is managed; everything below it closed
# before those signals existed, so it is admitted as it stands. Requiring
# Batches 0-21 to be rewritten would be fabricating evidence, not checking it.
# Batch 22 is the first managed batch.
#
# A boundary rather than a list of managed batches: a list can be opted out of
# by omission, and a boundary cannot, because a new batch lands above it by
# arithmetic. Moving the boundary is an edit here, in review.
[closeout]
admit_from_batch = 22

