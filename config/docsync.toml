# ----------------------------------------------------------------------
# Anchors
# ----------------------------------------------------------------------

# The citation this whole check exists for. RECONCILIATION.md pointed at
# `AGENTS.md` "Proposal and Design Rules" item 6; the rule moved to a new
# section in the same commit that created it, and the pointer stayed behind.
# Citing by name was already the rule and did not save it, because the name
# itself changed.
#
# The pattern is a shape, not one citation, so a reference written tomorrow is
# checked with no new declaration.
#
# The scan is every Markdown tree, not a list of the ones anyone remembered.
# Naming them individually missed docs/SWE_AUDIT_CHARTER.md, which cites
# `AGENTS.md` "Session Bootstrap" and is as normative as any root document;
# the citation would have gone stale with the gate green. A tree added
# tomorrow is covered without anyone editing this file.
#
# Three exemptions, and each is a rule about what the file is for:
#   docs/history/*   -- a dated record of what a document said that day.
#   docs/logarchive/* -- the same, rotated out of PLAYBOOK Section 4.
# AGENTS.md already treats a point-in-time record as accurate at write time,
# so a citation that was right when it was written stays as written. Without
# these two, renaming one AGENTS.md heading turns 70 archived files red and
# the only fix would be editing history.
#   CLAUDE.md        -- gitignored, so it exists on one machine and not on
# CI. Scanning it makes the gate's answer depend on who runs it.
[[anchor]]
name = "AGENTS.md section and item citations"
target = "AGENTS.md"
pattern = '`AGENTS\.md` "([^"]+)"(?: item (\d+))?'
scan = ["*.md", "docs/**/*.md", ".claude/SESSION_CONTEXT.md"]
allow_files = ["docs/history/*", "docs/logarchive/*", "CLAUDE.md"]

# The design contract is cited the same way and moves for the same reasons.
# The plans cite it heavily and were not scanned: the WP-3 plan's citation of
# "Responsive" was the first thing this widening found.
[[anchor]]
name = "design README section citations"
target = "docs/design/README.md"
pattern = '`docs/design/README\.md` "([^"]+)"'
scan = [
  "*.md",
  "docs/**/*.md",
  ".claude/SESSION_CONTEXT.md",
  "static/css/*.css",
  "scripts/dev/*.py",
]
allow_files = ["docs/history/*", "docs/logarchive/*", "CLAUDE.md"]

# `docs/agents/ui-accessibility.md` moved out of AGENTS.md on 2026-09-19 with
# its item numbering preserved because two design documents cite specific
# items by number. Declared so a citation written tomorrow is checked with no
# new declaration, the same reasoning as the two anchors above. Same three
# exemptions and the same reasons: docs/history and docs/logarchive are dated
# records, and CLAUDE.md is gitignored and would make the gate depend on who
# runs it.
[[anchor]]
name = "UI and Accessibility Rules citations"
target = "docs/agents/ui-accessibility.md"
pattern = '`docs/agents/ui-accessibility\.md` "([^"]+)"(?: item (\d+))?'
scan = ["*.md", "docs/**/*.md", ".claude/SESSION_CONTEXT.md"]
allow_files = ["docs/history/*", "docs/logarchive/*", "CLAUDE.md"]

