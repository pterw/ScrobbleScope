default_stages: [pre-commit]
exclude: ^(venv|\.venv|env|\.env|node_modules|dist|build|\.vscode|docs|logs|oldlogs|static|templates)/

repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        files: ^.*\.py$

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        files: ^.*\.py$

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
      - id: autoflake
        files: ^.*\.py$
        args: [--remove-unused-variables, --remove-all-unused-imports]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: ^.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^.*\.(py|md|yaml|yml|txt)$
      - id: end-of-file-fixer
        files: ^.*\.(py|md|yaml|yml|txt)$
      - id: check-yaml
        files: ^.*\.(yaml|yml)$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: doc-state-sync-check
        name: doc-state-sync-check
        entry: python scripts/doc_state_sync.py --check
        language: python
        pass_filenames: false
        always_run: true

      # always_run and pass_filenames are load-bearing. The top-level exclude
      # filters out static/, so a filename-driven hook would never run on the
      # one file this exists to check.
      - id: tailwind-css-drift
        name: tailwind-css-drift
        entry: python scripts/dev/tailwind_build.py --check
        language: python
        pass_filenames: false
        always_run: true

      # Advisory on purpose: --advisory always exits 0, and verbose prints the
      # diagnostics on a passing run. The problem this solves is that the
      # guard's output was invisible unless somebody remembered to run it, not
      # that commits needed a new gate.
      #
      # It must not gate. Eleven of the fifteen codes are errors -- WT001,
      # WT002, WT003, WT004, WT005, WT006, WT007, WT008, WT012, WT014, and
      # WT009 inside a linked worktree. WT003 fires for any branch the active
      # batch does not name and WT004 for the identical-tree divergence a
      # rebase merge always leaves, so gating here would refuse every commit
      # on a feature branch and every commit after a merge until the branch is
      # realigned. Only WT010 (dirty tree) and WT000/WT011/WT013 are not
      # errors. An earlier revision of this hook claimed the error set was
      # three codes; a PR #220 reviewer corrected it.
      - id: worktree-alignment
        name: worktree-alignment
        entry: python scripts/dev/check_worktree_alignment.py --advisory
        language: python
        pass_filenames: false
        always_run: true
        verbose: true
