default_stages: [pre-commit]
exclude: ^(venv|\.venv|env|\.env|node_modules|dist|build|\.vscode|docs|logs|oldlogs|static|templates)/

repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        files: ^.*\.py$

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        files: ^.*\.py$

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
      - id: autoflake
        files: ^.*\.py$
        args: [--remove-unused-variables, --remove-all-unused-imports]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: ^.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^.*\.(py|md|yaml|yml|txt)$
      - id: end-of-file-fixer
        files: ^.*\.(py|md|yaml|yml|txt)$
      - id: check-yaml
        files: ^.*\.(yaml|yml)$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: doc-state-sync-check
        name: doc-state-sync-check
        entry: python scripts/doc_state_sync.py --check
        language: python
        pass_filenames: false
        always_run: true

      # always_run and pass_filenames are load-bearing. The top-level exclude
      # filters out static/, so a filename-driven hook would never run on the
      # one file this exists to check.
      - id: tailwind-css-drift
        name: tailwind-css-drift
        entry: python scripts/dev/tailwind_build.py --check
        language: python
        pass_filenames: false
        always_run: true

      # The guard already exits 1 on an ERROR diagnostic and 0 otherwise, so
      # it was built to gate and was simply never wired to one. Only WT002
      # (PLAYBOOK Section 3 unparseable), WT007 (base ref absent) and WT014
      # (inspection failed) are errors. WT004, the identical-tree state a
      # rebase merge always leaves, is not, and neither is WT010 for a dirty
      # tree -- so the states the owner treats as normal still commit.
      # verbose surfaces the INFO lines on a passing run, which is the point:
      # branch lineage should be visible at commit time, not only when
      # somebody remembers to ask for it.
      - id: worktree-alignment
        name: worktree-alignment
        entry: python scripts/dev/check_worktree_alignment.py
        language: python
        pass_filenames: false
        always_run: true
        verbose: true
