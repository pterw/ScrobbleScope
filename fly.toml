# fly.toml app configuration file generated for scrobblescope on 2026-02-11T18:57:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "scrobblescope"
primary_region = "yyz"

# [build] is intentionally empty; the Dockerfile is paired by co-location at
# the repository root. See DEPLOY.md ("Where the config lives") before moving.
[build]

[deploy]
  release_command = "python init_db.py"

# The app stops itself when idle (see DEPLOY.md "Idle exit"), so Fly's own
# autostop is off.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  processes = ['app']

[env]
  IDLE_EXIT_MINUTES = "20"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 512
