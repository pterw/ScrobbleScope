name: Quality Gate

on:
  push:
    branches:
      - main
      - 'wip/**'
  pull_request:
  # Manual escape hatch. GitHub silently created no run for the push of
  # 8463ca4 on wip/batch-21 even though the event was delivered and Actions
  # was healthy, leaving a PR with no gate result and no way to re-run it.
  # Note this trigger only becomes usable once it is on the default branch.
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FLASK_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Cache pinned Tailwind assets
        uses: actions/cache@v4
        with:
          path: scripts/bin
          key: tailwind-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dev/tailwind_build.py') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The tailwind-css-drift pre-commit hook rebuilds and diffs, so the
      # direct build-and-diff step this replaces would compile the stylesheet
      # a second time for the same answer.
      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files

      # Diagnostic only; nothing is enforced here. The drift hook proves
      # the committed file matches a rebuild on this runner. It cannot
      # show a Windows build matching the Linux one, and WP-1's contract
      # asks for reproducibility to be measured. This printed digest is
      # what lets the two be compared by eye, from the logs, months apart.
      - name: Print committed Tailwind CSS digest
        run: |
          sha256sum static/css/tailwind.css

      - name: Run Tests with Coverage
        run: |
          pytest --cov=scrobblescope --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      # Last on purpose. Starting a browser costs far more than a lint, a
      # rebuild or the suite, so every cheaper gate reports first.
      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run frontend gate
        run: |
          python scripts/dev/frontend_gate.py

      - name: Security audit (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
        continue-on-error: true
