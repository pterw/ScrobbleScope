name: Quality Gate

on:
  push:
    branches:
      - main
      - 'wip/**'
  pull_request:
  # Manual escape hatch. GitHub silently created no run for the push of
  # 8463ca4 on wip/batch-21 even though the event was delivered and Actions
  # was healthy, leaving a PR with no gate result and no way to re-run it.
  # Note this trigger only becomes usable once it is on the default branch.
  workflow_dispatch:

jobs:
  # Decides whether the browser job can be skipped. Only a pull request can be
  # docs-only, and it is judged on the whole pull request against its base:
  # actions/checkout's default refs/pull/N/merge commit has the base tip as
  # its first parent, so HEAD^1..HEAD lists what the pull request changes and
  # not what the base gained since the branch was cut. A per-push diff would
  # let a docs-only commit on top of a code pull request skip the browser job.
  # Fail closed: any git failure leaves docs_only false. The path rules live
  # in scripts/dev/ci_jobs.py, where the tests cover them.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify the changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          docs_only=false
          if [ "$EVENT_NAME" = pull_request ] && git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            docs_only=$(git diff --name-only --no-renames -z HEAD^1 HEAD | python3 scripts/dev/ci_jobs.py docs-only) || docs_only=false
          fi
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest

    # Least privilege (zizmor: excessive-permissions / artipacked). The job
    # only reads the checkout and uploads a coverage artifact; without this
    # block the runner's default GITHUB_TOKEN permissions are broader than
    # anything the steps need, and every third-party action inherits them.
    permissions:
      contents: read

    env:
      # No provider secret is passed to this job. tests/conftest.py and
      # scripts/dev/frontend_gate.py supply placeholders, and no step reads
      # a real key. A step that ever needs one takes it in its own `env:`.
      FLASK_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Cache pinned Tailwind assets
        uses: actions/cache@v6
        with:
          path: scripts/bin
          key: tailwind-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dev/tailwind_build.py') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Explicit and first, ahead of pre-commit's own hooks: this runner has
      # no repository .venv (dependencies just landed in the system Python
      # above), so `docsync_preflight.py --worktree` falls back to the
      # interpreter already running it rather than demanding one. It also
      # means the check still runs here even if a contributor's local hook
      # was skipped or bypassed (git commit --no-verify) -- CI is the
      # backstop; see "Enforcement boundary" in
      # docs/superpowers/specs/2026-09-15-docsync-closeout-archives-design.md.
      # `--worktree`, not `--staged`: there is no Git index/working-tree
      # distinction to preserve here, only the one checkout the workflow
      # already ran actions/checkout against.
      - name: Run docsync preflight
        run: |
          python scripts/dev/docsync_preflight.py --worktree

      # The tailwind-css-drift pre-commit hook rebuilds and diffs, so the
      # direct build-and-diff step this replaces would compile the stylesheet
      # a second time for the same answer.
      # worktree-alignment is skipped here on purpose. The guard checks
      # developer worktree lineage -- which branch is checked out, how it
      # relates to origin/main, which virtualenv the tools resolve to. A
      # runner has none of that: actions/checkout makes a shallow
      # single-branch clone with no origin/main, so the guard reports
      # ERROR WT007 for a base ref that is legitimately absent, and
      # WARNING WT009 for a .venv that CI does not use. Fetching the base
      # ref would silence WT007 and still leave the check measuring
      # nothing. The states it exists to catch can only occur on a
      # developer machine.
      #
      # doc-state-sync-check runs again here, inside pre-commit
      # (.pre-commit-config.yaml's own --worktree entry). That is a
      # deliberately cheap redundant re-check, not wasted work: this step
      # is what a contributor's own machine also runs before every commit,
      # so a discrepancy between the two would mean this workflow step
      # and a local commit no longer agree on what passes.
      - name: Run pre-commit checks
        env:
          SKIP: worktree-alignment
        run: |
          pre-commit run --all-files

      # Diagnostic only; nothing is enforced here. The drift hook proves
      # the committed file matches a rebuild on this runner. It cannot
      # show a Windows build matching the Linux one, and WP-1's contract
      # asks for reproducibility to be measured. This printed digest is
      # what lets the two be compared by eye, from the logs, months apart.
      - name: Print committed Tailwind CSS digest
        run: |
          sha256sum static/css/tailwind.css

      - name: Run Tests with Coverage
        run: |
          pytest -m "not browser" --cov=scrobblescope --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      - name: Security audit (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt requirements-dev.txt
        continue-on-error: true

  # The slowest job (the frontend gate), run beside the cheaper ones so the
  # run takes as long as it does. It is skipped only for a docs-only pull
  # request; quality-gate below turns every other skip into a failure.
  browser:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # No provider secret is passed to this job. scripts/dev/frontend_gate.py
      # supplies placeholders, and no step reads a real key. A step that ever
      # needs one takes it in its own `env:`.
      FLASK_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Read the runner image version
        id: runner-image
        run: echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # --with-deps installs about 50 MB of Ubuntu packages (48 of them on
      # 2026-10-22) from the runner's Azure mirror on every run. That day the
      # mirror served them at 43.5 kB/s and the step took 21 minutes instead
      # of about one (F-B23-57). The packages are kept between runs here, so
      # apt downloads only a package newer than the cached one; its index
      # still comes from the mirror (12.5 MB in 16 s that day). The runner
      # image version is in the key, so the cache refreshes with the image,
      # and the restore key reuses the previous image's packages meanwhile.
      - name: Restore Playwright system packages
        id: playwright-apt
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            playwright-apt-${{ runner.os }}-${{ runner.arch }}-

      # Starting a browser costs far more than a lint, a rebuild or the
      # suite. This job is the slowest and runs beside the cheaper ones.
      - name: Install Playwright browser
        run: |
          # apt reads packages from a root-owned directory the cache action
          # cannot write, so the cached ones are copied in first and the
          # current set copied back after; autoclean drops versions the
          # mirror no longer serves, so the cache does not grow without end.
          mkdir -p ~/.cache/playwright-apt
          find ~/.cache/playwright-apt -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +
          python -m playwright install --with-deps chromium firefox
          sudo apt-get autoclean -q
          rm -f ~/.cache/playwright-apt/*.deb
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-apt/ {} +
          echo "cached packages: $(find ~/.cache/playwright-apt -name '*.deb' | wc -l)"
          du -sh ~/.cache/playwright-apt

      # Saved here, not by the cache action's own post-job step: that one
      # saves only when the whole job succeeds. Saving right after the
      # install means a later failure (the frontend gate or any step after
      # it) no longer prevents the cache from filling. A hit on the exact
      # key means the cache is already stored under it.
      - name: Save Playwright system packages
        if: steps.playwright-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-apt.outputs.cache-primary-key }}

      - name: Run frontend gate
        if: ${{ github.event_name != 'pull_request' || (github.head_ref != 'fly.io-deploy' && github.head_ref != 'flyio-deploy') }}
        run: |
          # The marker decides what runs here, not the directory: the coverage
          # step deselects the marker across the whole tree, so a browser test
          # outside tests/frontend/ would otherwise run in neither step.
          python -m pytest -m browser -q
          python scripts/dev/results_behavior_tests.py
          python scripts/dev/frontend_gate.py

  # The one required check. It reports even when a job above was skipped or
  # failed (`always()`; a cancelled run reads red, the safe side) and passes
  # only when changes and checks succeeded and browser either succeeded or was
  # skipped for a docs-only pull request. The results arrive through `env:`,
  # never interpolated into the script.
  quality-gate:
    needs: [changes, checks, browser]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Aggregate the job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          python3 scripts/dev/ci_jobs.py aggregate \
            --changes "$CHANGES_RESULT" \
            --checks "$CHECKS_RESULT" \
            --browser "$BROWSER_RESULT" \
            --docs-only "$DOCS_ONLY"
