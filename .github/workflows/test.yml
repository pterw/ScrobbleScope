name: Quality Gate

on:
  push:
    branches:
      - main
      - 'wip/**'
  pull_request:
  # Manual escape hatch. GitHub silently created no run for the push of
  # 8463ca4 on wip/batch-21 even though the event was delivered and Actions
  # was healthy, leaving a PR with no gate result and no way to re-run it.
  # Note this trigger only becomes usable once it is on the default branch.
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    # Least privilege (zizmor: excessive-permissions / artipacked). The job
    # only reads the checkout and uploads a coverage artifact; without this
    # block the runner's default GITHUB_TOKEN permissions are broader than
    # anything the steps need, and every third-party action inherits them.
    permissions:
      contents: read

    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FLASK_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Cache pinned Tailwind assets
        uses: actions/cache@v6
        with:
          path: scripts/bin
          key: tailwind-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dev/tailwind_build.py') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Explicit and first, ahead of pre-commit's own hooks: this runner has
      # no repository .venv (dependencies just landed in the system Python
      # above), so `docsync_preflight.py --worktree` falls back to the
      # interpreter already running it rather than demanding one. It also
      # means the check still runs here even if a contributor's local hook
      # was skipped or bypassed (git commit --no-verify) -- CI is the
      # backstop; see "Enforcement boundary" in
      # docs/superpowers/specs/2026-09-15-docsync-closeout-archives-design.md.
      # `--worktree`, not `--staged`: there is no Git index/working-tree
      # distinction to preserve here, only the one checkout the workflow
      # already ran actions/checkout against.
      - name: Run docsync preflight
        run: |
          python scripts/dev/docsync_preflight.py --worktree

      # The tailwind-css-drift pre-commit hook rebuilds and diffs, so the
      # direct build-and-diff step this replaces would compile the stylesheet
      # a second time for the same answer.
      # worktree-alignment is skipped here on purpose. The guard checks
      # developer worktree lineage -- which branch is checked out, how it
      # relates to origin/main, which virtualenv the tools resolve to. A
      # runner has none of that: actions/checkout makes a shallow
      # single-branch clone with no origin/main, so the guard reports
      # ERROR WT007 for a base ref that is legitimately absent, and
      # WARNING WT009 for a .venv that CI does not use. Fetching the base
      # ref would silence WT007 and still leave the check measuring
      # nothing. The states it exists to catch can only occur on a
      # developer machine.
      #
      # doc-state-sync-check runs again here, inside pre-commit
      # (.pre-commit-config.yaml's own --worktree entry). That is a
      # deliberately cheap redundant re-check, not wasted work: this step
      # is what a contributor's own machine also runs before every commit,
      # so a discrepancy between the two would mean this workflow step
      # and a local commit no longer agree on what passes.
      - name: Run pre-commit checks
        env:
          SKIP: worktree-alignment
        run: |
          pre-commit run --all-files

      # Diagnostic only; nothing is enforced here. The drift hook proves
      # the committed file matches a rebuild on this runner. It cannot
      # show a Windows build matching the Linux one, and WP-1's contract
      # asks for reproducibility to be measured. This printed digest is
      # what lets the two be compared by eye, from the logs, months apart.
      - name: Print committed Tailwind CSS digest
        run: |
          sha256sum static/css/tailwind.css

      - name: Run Tests with Coverage
        run: |
          pytest -m "not browser" --cov=scrobblescope --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      # Last on purpose. Starting a browser costs far more than a lint, a
      # rebuild or the suite, so every cheaper gate reports first.
      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium firefox

      - name: Run frontend gate
        if: ${{ github.event_name != 'pull_request' || (github.head_ref != 'fly.io-deploy' && github.head_ref != 'flyio-deploy') }}
        run: |
          python -m pytest -m browser tests/frontend -q
          python scripts/dev/results_behavior_tests.py
          python scripts/dev/frontend_gate.py

      - name: Security audit (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
        continue-on-error: true
