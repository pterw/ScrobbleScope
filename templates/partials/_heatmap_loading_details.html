<div class="heatmap-loading__stats hidden" id="heatmap-loading-stats"
     aria-label="Live heatmap statistics">
  <div class="heatmap-loading__stat hidden" data-heatmap-stat="pages">
    <span class="heatmap-loading__stat-label">Pages fetched</span>
    <strong class="heatmap-loading__stat-value" id="heatmap-stat-pages">0 / 0</strong>
  </div>
  <div class="heatmap-loading__stat hidden" data-heatmap-stat="scrobbles">
    <span class="heatmap-loading__stat-label">Scrobbles counted</span>
    <strong class="heatmap-loading__stat-value" id="heatmap-stat-scrobbles">0</strong>
  </div>
  <div class="heatmap-loading__stat hidden" data-heatmap-stat="days">
    <span class="heatmap-loading__stat-label">Days with listening</span>
    <strong class="heatmap-loading__stat-value" id="heatmap-stat-days">0</strong>
  </div>
</div>

<ul class="heatmap-loading__params" aria-label="Heatmap parameters">
  <li id="heatmap-loading-username">Last.fm profile</li>
  <li>last 365 days</li>
</ul>
<a class="ss-btn heatmap-loading__back" href="/">Cancel and return home</a>
