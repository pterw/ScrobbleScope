# Drifted in WP-3: the stylesheets moved to the design's single 860px
# breakpoint and the renderer stayed at 768, so widths from 768 to 859 got the
# mobile frame with the desktop grid scaled into it.
#
# Each site captures what it reads and declares what it should be, rather
# than only asserting a literal is present somewhere in the file. A media
# query stops just short of the breakpoint and writes 859.98px while the
# script compares against 860, so the two notations are both correct, and
# `expect` is what lets them differ without the check going blind.
#
# Every occurrence is checked, not the first: index.css carries the breakpoint
# across several min/max media queries, and a check that stopped at the first
# would pass a file that contradicted itself further down.
#
# The @media prefix matters. index.css also has ordinary max-width properties,
# and those are widths, not breakpoints.
[[value]]
name = "the single 860px breakpoint"

[[value.sites]]
file = "static/css/index.css"
pattern = '@media[^{]*max-width: ([\d.]+)px'
expect = "859.98"

[[value.sites]]
file = "static/css/index.css"
pattern = '@media \(min-width: ([\d.]+)px\) \{ [^}]*\.(?:index-page|index-hero|index-form) \{'
expect = "860"

